<script>
/* 独立导出用：lucide 替身 —— 把 data-lucide 占位替换为上面内联 sprite 的引用，零 CDN 依赖 */
window.lucide = {
  createIcons: function () {
    var nodes = document.querySelectorAll('[data-lucide]');
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var name = el.getAttribute('data-lucide');
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('width', '16');
      svg.setAttribute('height', '16');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '1.8');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      svg.setAttribute('aria-hidden', 'true');
      svg.innerHTML = '<use href="#i-' + name + '"></use>';
      el.parentNode.replaceChild(svg, el);
    }
  }
};
</script>
<div id="sk-boot-mock" aria-label="skillkit 启动加载动画方案" data-previous-label="上一个" data-next-label="下一个">

  <style>
    #sk-boot-mock{
      --sk-font:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Noto Sans SC",sans-serif;
      --sk-display:"Bahnschrift","Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",sans-serif;
      --sk-mono:"Cascadia Mono","Consolas","SFMono-Regular",monospace;
      --sk-bg:light-dark(#f3f6fb,#080b12);
      --sk-surface:light-dark(#ffffff,#111722);
      --sk-surface-2:light-dark(#f7f9fd,#151d2a);
      --sk-surface-3:light-dark(#edf1f8,#1d2635);
      --sk-ink:light-dark(#0b1020,#ffffff);
      --sk-ink-2:light-dark(rgba(11,16,32,.62),rgba(255,255,255,.64));
      --sk-ink-3:light-dark(rgba(11,16,32,.42),rgba(255,255,255,.44));
      --sk-line:light-dark(rgba(11,16,32,.09),rgba(255,255,255,.08));
      --sk-accent:light-dark(#2e63f6,#7c9dff);
      --sk-violet:light-dark(#6f56e3,#a78bfa);
      --sk-rose:light-dark(#d2406f,#ff7aa6);
      --sk-teal:light-dark(#0a8f96,#46d4d8);
      --sk-slate:light-dark(#51607a,#9fb0c9);
      --sk-success:light-dark(#0e9f6e,#3dd68c);
      --sk-warning:light-dark(#c07a09,#f4b740);
      --sk-ease:cubic-bezier(.2,0,0,1);
      --sk-spring:cubic-bezier(.34,1.56,.64,1);
      --sk-logo-grad:linear-gradient(135deg,#3d7bff,#2e63f6 55%,#12c2cf);
      --sk-bar-grad:linear-gradient(90deg,light-dark(#2e63f6,#7c9dff),light-dark(#12c2cf,#46d4d8));

      width:100%;
      font-family:var(--sk-font);
      color:var(--sk-ink);
      font-size:14px;
      line-height:1.5;
    }
    #sk-boot-mock.sk-dark{ color-scheme:dark }
    #sk-boot-mock *,#sk-boot-mock *::before,#sk-boot-mock *::after{ box-sizing:border-box }
    #sk-boot-mock svg{ display:block }

    /* ---------- variant stage / replay ---------- */
    #sk-boot-mock > section{ padding:6px 0 10px }
    #sk-boot-mock .sk-stage{ padding:14px 2px 0 }
    #sk-boot-mock .sk-replay{ display:flex; justify-content:center; padding:12px 0 2px }

    /* ---------- window ---------- */
    #sk-boot-mock .sk-win{
      position:relative; overflow:hidden; display:flex; flex-direction:column;
      border-radius:16px; border:1px solid var(--sk-line);
      background:var(--sk-bg); color:var(--sk-ink);
      box-shadow:0 30px 80px light-dark(rgba(11,16,32,.16),rgba(0,0,0,.5)),
                 0 6px 18px light-dark(rgba(11,16,32,.08),rgba(0,0,0,.35));
    }

    /* ---------- titlebar ---------- */
    #sk-boot-mock .sk-tb{
      height:46px; flex:0 0 auto; display:flex; align-items:center; gap:9px;
      padding:0 6px 0 14px; background:var(--sk-surface); border-bottom:1px solid var(--sk-line);
    }
    #sk-boot-mock .sk-logo{ width:24px; height:24px; border-radius:7px; background:var(--sk-logo-grad); display:grid; place-items:center; flex:0 0 auto }
    #sk-boot-mock .sk-wordmark{ font:600 15px/1 var(--sk-display); letter-spacing:-.01em }
    #sk-boot-mock .sk-bdiv{ width:1px; height:16px; background:var(--sk-line) }
    #sk-boot-mock .sk-bsub{ font:600 9.5px/1 var(--sk-font); letter-spacing:.14em; color:var(--sk-ink-3) }
    #sk-boot-mock .sk-gsearch{
      margin-left:12px; width:min(300px,32%); height:30px; border-radius:8px;
      background:var(--sk-surface-2); border:1px solid var(--sk-line);
      display:flex; align-items:center; gap:7px; padding:0 8px; color:var(--sk-ink-3);
    }
    #sk-boot-mock .sk-gsearch i{ color:var(--sk-ink-3); display:grid; place-items:center }
    #sk-boot-mock .sk-gsearch em{ font-style:normal; font-size:11.5px; flex:1; white-space:nowrap; overflow:hidden }
    #sk-boot-mock .sk-gsearch kbd{
      font:400 9.5px/1 var(--sk-mono); padding:3px 5px; border-radius:4px;
      background:var(--sk-surface); border:1px solid var(--sk-line); color:var(--sk-ink-3);
    }
    #sk-boot-mock .sk-tb-actions{ margin-left:auto; display:flex; align-items:center; gap:4px }
    #sk-boot-mock .sk-pill{
      height:20px; padding:0 8px; border-radius:20px; display:inline-flex; align-items:center; gap:5px;
      background:color-mix(in srgb,var(--sk-success) 12%,transparent); color:var(--sk-success);
      font:600 9px/1 var(--sk-mono); letter-spacing:.1em;
    }
    #sk-boot-mock .sk-pill i{ width:5px; height:5px; border-radius:50%; background:currentColor }
    #sk-boot-mock .sk-tbtn{
      width:30px; height:30px; border-radius:8px; display:grid; place-items:center; color:var(--sk-ink-2);
    }
    #sk-boot-mock .sk-tbtn.win{ width:42px; height:32px; border-radius:7px }
    #sk-boot-mock .sk-tbtn.win.close:hover{ background:light-dark(#e81123,#c42b1c); color:#fff }

    /* ---------- app body ---------- */
    #sk-boot-mock .sk-app{ flex:1 0 auto; display:flex; height:560px; min-height:0 }

    /* sidebar */
    #sk-boot-mock .sk-side{
      width:216px; flex:0 0 auto; border-right:1px solid var(--sk-line);
      padding:12px 10px; display:flex; flex-direction:column; gap:10px; background:var(--sk-bg); overflow:hidden;
    }
    #sk-boot-mock .sk-store{ background:var(--sk-surface); border:1px solid var(--sk-line); border-radius:12px; padding:10px; box-shadow:0 1px 2px light-dark(rgba(11,16,32,.04),transparent) }
    #sk-boot-mock .sk-store-top{ display:flex; align-items:center; justify-content:space-between }
    #sk-boot-mock .sk-eyebrow{ font:600 9.5px/1 var(--sk-font); letter-spacing:.12em; color:var(--sk-ink-3) }
    #sk-boot-mock .sk-live{
      height:16px; padding:0 6px; border-radius:8px; display:inline-flex; align-items:center; gap:4px;
      background:color-mix(in srgb,var(--sk-success) 13%,transparent); color:var(--sk-success);
      font:600 8.5px/1 var(--sk-mono); letter-spacing:.08em;

    #sk-boot-mock .sk-live i{ width:4px; height:4px; border-radius:50%; background:currentColor }
    #sk-boot-mock .sk-store-path{ margin-top:7px; font:400 10.5px/1.2 var(--sk-mono); color:var(--sk-ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
    #sk-boot-mock .sk-store-meta{ margin-top:4px; font-size:11px; color:var(--sk-ink-3); display:flex; justify-content:space-between; align-items:baseline }
    #sk-boot-mock .sk-store-meta b{ font:600 13px/1 var(--sk-display); color:var(--sk-ink); letter-spacing:-.02em }
    #sk-boot-mock .sk-health{ margin-top:8px; height:4px; border-radius:2px; background:var(--sk-surface-3); overflow:hidden }
    #sk-boot-mock .sk-health i{ display:block; height:100%; width:78%; border-radius:2px; background:linear-gradient(90deg,var(--sk-success),color-mix(in srgb,var(--sk-success) 55%,var(--sk-teal))) }
    #sk-boot-mock .sk-navlabel{ font:600 10px/1 var(--sk-font); letter-spacing:.1em; color:var(--sk-ink-3); padding:0 4px }
    #sk-boot-mock .sk-nav{ display:flex; flex-direction:column; gap:3px }
    #sk-boot-mock .sk-navi{
      height:36px; border-radius:9px; display:flex; align-items:center; gap:8px; padding:0 9px;
      font:500 12.5px/1 var(--sk-font); color:var(--sk-ink-2); position:relative;
    }
    #sk-boot-mock .sk-navi i{ color:var(--sk-ink-3); display:grid; place-items:center }
    #sk-boot-mock .sk-navi b{
      margin-left:auto; font:600 10px/18px var(--sk-mono); min-width:18px; text-align:center;

    #sk-boot-mock .sk-navi.on{ background:color-mix(in srgb,var(--sk-accent) 10%,transparent); color:var(--sk-ink); box-shadow:inset 3px 0 0 0 var(--sk-accent) }
    #sk-boot-mock .sk-navi.on i{ color:var(--sk-accent) }
    #sk-boot-mock .sk-navi.on b{ background:color-mix(in srgb,var(--sk-accent) 16%,transparent); color:var(--sk-accent) }

    #sk-boot-mock .sk-fold b{ margin-left:auto; font:400 10px/1 var(--sk-mono); color:var(--sk-ink-3) }
    #sk-boot-mock .sk-fold.more{ color:var(--sk-ink-3); font-size:10.5px }

      height:21px; padding:0 8px; border-radius:11px; display:inline-flex; align-items:center; gap:4px;
      background:color-mix(in srgb,var(--sk-success) 13%,transparent); color:var(--sk-success); font:500 10px/1 var(--sk-font);
    }
    #sk-boot-mock .sk-insbody{ padding:13px 16px; display:flex; flex-direction:column; gap:7px; overflow:hidden }
    #sk-boot-mock .sk-lab{ font:600 10px/1 var(--sk-font); letter-spacing:.1em; color:var(--sk-ink-3); margin-top:5px }
    #sk-boot-mock .sk-input{
      height:38px; border-radius:9px; border:1px solid var(--sk-line); background:var(--sk-surface);
      display:flex; align-items:center; padding:0 10px; font:600 13px/1 var(--sk-font);

  <script>
  (function () {
    var root = document.getElementById('sk-boot-mock');
    if (!root) return;
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

    /* ---------- 预览状态（深色 / 速度），经 Tweak 修改并持久化 ---------- */
    var state = { dark: false, speed: 1 };
    try {
      var saved = window.zcode && window.zcode.widgetState && window.zcode.widgetState.privateContent;
      if (saved && typeof saved === 'object') {
        if (typeof saved.dark === 'boolean') state.dark = saved.dark;
        if (typeof saved.speed === 'number' && saved.speed > 0) state.speed = saved.speed;
      }
    } catch (e) {}
    function applyState() {
      root.classList.toggle('sk-dark', state.dark);
      root.style.setProperty('--k', String(Math.round((1 / state.speed) * 1000) / 1000));
    }
    function persist() {
      try {
        if (window.zcode && window.zcode.setWidgetState) {
          window.zcode.setWidgetState({ privateContent: { dark: state.dark, speed: state.speed } });
        }
      } catch (e) {}
    }
    applyState();
    document.addEventListener('zcode:set_globals', function (ev) {
      try {
        var g = ev.detail && ev.detail.globals;
        var pc = g && g.widgetState && g.widgetState.privateContent;
        if (pc && typeof pc === 'object') {
          if (typeof pc.dark === 'boolean') state.dark = pc.dark;
          if (typeof pc.speed === 'number' && pc.speed > 0) state.speed = pc.speed;
          applyState();
        }
      } catch (e) {}
    });

    /* ---------- 数据（真实库快照中的代表技能与 7 个 agent） ---------- */
    var CAT = {
      eng: '--sk-slate', design: '--sk-violet', doc: '--sk-accent',
      video: '--sk-rose', mem: '--sk-teal', search: '--sk-warning'
    };
    var CHIPS = [
      ['aihot', 'search'], ['brandkit', 'design'], ['pdf', 'doc'], ['browser-use', 'eng'],
      ['remotion-create', 'video'], ['mnemosyne-os-memory', 'mem'], ['skill-creator', 'eng'],
      ['frontend-design', 'design'], ['pptx', 'doc'], ['webapp-testing', 'eng'],
      ['ui-design-system', 'design'], ['prompt-optimizer-zh', 'eng'],
      ['github-pages-auto-deploy', 'eng'], ['imagegen-frontend-web', 'design'],
      ['ci-compile-guard', 'eng'], ['design-taste-frontend', 'design'], ['xlsx', 'doc'],
      ['video-shotcraft', 'video'], ['dev-expert', 'eng'], ['find-skills', 'eng']
    ];
    var AGD = [
      ['claude_code', '.claude/skills'], ['codex', '.codex/skills'],
      ['deepseek_harness', '.dsh/skills'], ['qoder', '.qoder/skills'],
      ['trae_cn', '.trae-cn/skills'], ['workbuddy', '.workbuddy/skills'], ['zcode', '.zcode/skills']
    ];
    function hash10(i) {
      var h = (((i + 1) * 2654435761) >>> 0);
      return ('000000000' + h.toString(16)).slice(-10);
    }

    /* ---------- 注入窗口骨架 ---------- */
    var tpl = document.getElementById('sk-shell-tpl');
    if (tpl) {
      var slots = root.querySelectorAll('.sk-app-slot');
      for (var si = 0; si < slots.length; si++) {
        slots[si].appendChild(tpl.content.cloneNode(true));
      }
    }
    try { if (window.lucide && window.lucide.createIcons) window.lucide.createIcons({ attrs: { width: 16, height: 16 } }); } catch (e) {}

    /* ---------- 启动动画引擎 ---------- */
    function bootSection(section) {
      var win = section.querySelector('.sk-win');
      var bootEl = section.querySelector('.sk-boot');
      if (!win || !bootEl) return;
      if (section._cancel) section._cancel();
      if (reduce) {
        win.classList.remove('booting');
        win.classList.add('ready');
        bootEl.classList.add('run', 'ok', 'done');
        return;
      }
      var timers = [], ivs = [], dead = false;
      function t(fn, ms) { if (dead) return; timers.push(setTimeout(fn, Math.max(0, ms) / state.speed)); }
      function every(fn, ms) {
        if (dead) return null;
        var id = setInterval(fn, ms / state.speed);
        ivs.push(id);
        return id;
      }
      section._cancel = function () {
        dead = true;
        timers.forEach(clearTimeout);
        ivs.forEach(clearInterval);
      };

      win.classList.add('booting');
      win.classList.remove('ready');
      bootEl.classList.remove('done', 'ok', 'run');
      void bootEl.offsetWidth;
      bootEl.classList.add('run');

      var kind = bootEl.getAttribute('data-kind');
      if (kind === 'A') bootA(t, every, bootEl, win, timers);
      else if (kind === 'B') bootB(t, every, bootEl, win);
      else bootC(t, bootEl, win);
    }

    /* --- A · 徽章汇入 --- */
    function bootA(t, every, bootEl, win, timers) {
      var chips = bootEl.querySelector('.sk-chips');
      var agents = bootEl.querySelectorAll('.sk-agent');
      var ph = bootEl.querySelector('.sk-bphase .ph');
      var cnt = bootEl.querySelector('.sk-bphase .cnt');
      var line = bootEl.querySelector('.sk-bline');
      var fill = bootEl.querySelector('.sk-btrack i');
      chips.innerHTML = '';
      for (var i = 0; i < agents.length; i++) agents[i].classList.remove('on');
      cnt.textContent = '0 / 51';
      fill.style.width = '0%';
      ph.textContent = '正在启动';
      line.textContent = 'kernel ready · python 3.12.6';

      function setC(n) { cnt.textContent = n + ' / 51'; }
      function addChip() {
        if (ci >= CHIPS.length) return;
        var c = CHIPS[ci];
        var el = document.createElement('span');
        el.className = 'sk-chip';
        el.innerHTML = '<b style="--c:var(' + CAT[c[1]] + ')">' + c[0].slice(0, 2).toUpperCase() + '</b>' + c[0];
        chips.appendChild(el);
        ci++;
        if (chips.children.length > 14) {
          var f = chips.firstElementChild;
          if (f) {
            f.classList.add('out');
            timers.push(setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 240 / state.speed));
          }
        }
      }
      var ci = 0, pi = 0, ai = 0;
      var chipIv = null, cntIv = null, parseIv = null;

      t(function () { ph.textContent = '打开中央仓库'; line.textContent = 'D:\\skillkit\\store · 54.4 MB'; fill.style.width = '14%'; }, 460);
      t(function () {
        ph.textContent = '扫描技能目录';
        line.textContent = 'scan store … 51 skills · 2 unique';
        fill.style.width = '30%';
        chipIv = every(function () {
          if (ci >= CHIPS.length) { clearInterval(chipIv); return; }
          addChip();
        }, 118);
        var t0 = Date.now();
        cntIv = every(function () {
          var p = Math.min(1, (Date.now() - t0) / 2100);
          setC(Math.round(51 * (1 - Math.pow(1 - p, 3))));
          if (p >= 1) clearInterval(cntIv);
        }, 40);
      }, 860);
      t(function () {
        ph.textContent = '解析 SKILL.md';
        fill.style.width = '60%';
        parseIv = every(function () {
          var c = CHIPS[pi % CHIPS.length];
          pi++;
          line.textContent = 'parse ' + c[0] + '/SKILL.md → ' + hash10(pi);
        }, 150);
      }, 2060);
      t(function () {
        if (chipIv) clearInterval(chipIv);
        if (cntIv) clearInterval(cntIv);
        if (parseIv) clearInterval(parseIv);
        ph.textContent = '探测 agent 分发';
        fill.style.width = '78%';
        chips.innerHTML = '';
        every(function () {
          if (ai >= AGD.length) return;
          agents[ai].classList.add('on');
          line.textContent = 'link ' + AGD[ai][0] + ' → ' + AGD[ai][1] + ' … ok';
          ai++;
        }, 135);
      }, 2960);
      t(function () {
        ph.textContent = '载入分类与元数据';
        line.textContent = 'folders ×7 · meta ×51 · prefs ok';
        fill.style.width = '94%';
      }, 3960);
      t(function () {
        ph.textContent = '就绪';
        setC(51);
        fill.style.width = '100%';
        line.textContent = '51 个技能就绪 · 7 个 agent 已连接';
        bootEl.classList.add('ok');
      }, 4420);
      t(function () {
        bootEl.classList.add('done');
        win.classList.remove('booting');
        win.classList.add('ready');
      }, 4940);
    }

    /* --- B · 引导终端 --- */
    function bootB(t, every, bootEl, win) {
      var tls = bootEl.querySelectorAll('.tl');
      var avs = bootEl.querySelectorAll('.tl .v b');
      var fill = bootEl.querySelector('.sk-term-bar i');
      var pctEl = bootEl.querySelector('.sk-term-foot .pct');
      var hint = bootEl.querySelector('.sk-term-foot .hint');
      function set(v) { fill.style.width = v + '%'; pctEl.textContent = v + '%'; }
      function on(i) {
        for (var j = 0; j < tls.length; j++) tls[j].classList.remove('cur');
        if (tls[i]) { tls[i].classList.add('on'); tls[i].classList.add('cur'); }
      }
      for (var j = 0; j < tls.length; j++) tls[j].classList.remove('on', 'cur');
      for (var k = 0; k < avs.length; k++) avs[k].classList.remove('lit');
      set(0);
      hint.textContent = 'booting…';

      t(function () { on(0); }, 240);
      t(function () { on(1); set(12); }, 640);
      t(function () { on(2); set(34); }, 1120);
      t(function () { on(3); set(54); }, 1580);
      t(function () {
        on(4);
        var ai = 0;
        var id = every(function () {
          if (ai >= avs.length) { clearInterval(id); return; }
          avs[ai].classList.add('lit');
          set(60 + ai * 4);
          ai++;
        }, 140);
      }, 2020);
      t(function () { on(5); set(90); }, 3120);
      t(function () { on(6); set(100); hint.textContent = 'ready · 4.2 s'; bootEl.classList.add('ok'); }, 3560);
      t(function () {
        bootEl.classList.add('done');
        win.classList.remove('booting');
        win.classList.add('ready');
      }, 4080);
    }

    /* --- C · 轻量横线 --- */
    function bootC(t, bootEl, win) {
      var fill = bootEl.querySelector('.sk-c-track i');
      var lab = bootEl.querySelector('.sk-c-bar em');
      var doneEl = bootEl.querySelector('.sk-c-done');
      fill.style.width = '0%';
      lab.textContent = '正在启动';
      lab.classList.remove('sw');
      doneEl.classList.remove('on');
      function swap(s) {
        lab.classList.add('sw');
        t(function () { lab.textContent = s; lab.classList.remove('sw'); }, 120);
      }
      t(function () { swap('扫描 51 个 skill'); fill.style.width = '46%'; }, 420);
      t(function () { swap('探测 7 个 agent'); fill.style.width = '78%'; }, 1280);
      t(function () {
        lab.classList.remove('sw');
        lab.textContent = '就绪';
        fill.style.width = '100%';
        bootEl.classList.add('ok');
        doneEl.classList.add('on');
      }, 1900);
      t(function () {
        bootEl.classList.add('done');
        win.classList.remove('booting');
        win.classList.add('ready');
      }, 2480);
    }

    /* ---------- 首次可见自动播放一次 + 重播 ---------- */
    var sections = [];
    var secEls = root.querySelectorAll('section[data-variant]');
    for (var x = 0; x < secEls.length; x++) sections.push(secEls[x]);
    sections.forEach(function (s, i) {
      if (i === 0) {
        s._played = true;
        setTimeout(function () { bootSection(s); }, 420);
      } else {
        var mo = new MutationObserver(function () {
          if (!s.hasAttribute('hidden') && !s._played) {
            s._played = true;
            setTimeout(function () { bootSection(s); }, 300);
          }
        });
        mo.observe(s, { attributes: true, attributeFilter: ['hidden'] });
      }
      var rb = s.querySelector('[data-replay]');
      if (rb) rb.addEventListener('click', function () { s._played = true; bootSection(s); });
    });

    /* ---------- 设计控制 ---------- */
    try {
      if (globalThis.Tweak) {
        var tweak = new Tweak({ container: root, onChange: function () { applyState(); persist(); } });
        tweak.addToggle(state, 'dark', { label: '深色主题' });
        tweak.addSlider(state, 'speed', { label: '播放速度', min: 0.5, max: 2, step: 0.25, unit: '×' });
      }
    } catch (e) {}
  })();
  </script>
